version: 1
id: cedar-change-summary
plans:
  installed:
    resources:
      - source: AGENTS.md
        destination: AGENTS.md
      - source: .pi/skills/change-summary/SKILL.md
        install: true
        destination: .pi/skills/change-summary/SKILL.md
  base:
    resources:
      - source: AGENTS.md
        destination: AGENTS.md
      - source: .pi/skills/change-summary/SKILL.md
        install: false
  alternate:
    resources:
      - source: AGENTS.md
        destination: AGENTS.md
      - source: .pi/skills/change-summary/SKILL.md
        install: true
        destination: .agents/skills/change-summary/SKILL.md
context:
  plan: installed
cases:
  - id: matching-task
    turns:
      - send: 请把这些改动整理成发布说明：新增 CSV 导出，修复空列表闪退。
        expect:
          skill-loaded:
            name: change-summary
            loaded: true
          text-contains: [CHANGE_SUMMARY_OK, CSV, 空列表]
  - id: unrelated-task
    turns:
      - send: 17 乘以 3 是多少？简短回答。
        expect:
          skill-loaded:
            name: change-summary
            loaded: false
          text-contains: ["51"]
          text-not-contains: [CHANGE_SUMMARY_OK]
  - id: matching-task-alternate-location
    context:
      plan: alternate
    turns:
      - send: 请把这些改动整理成发布说明：新增 CSV 导出，修复空列表闪退。
        expect:
          skill-loaded:
            name: change-summary
            loaded: true
          text-contains: [CHANGE_SUMMARY_OK, CSV, 空列表]
  - id: not-installed
    context:
      plan: base
    turns:
      - send: 请把这些改动整理成发布说明：新增 CSV 导出，修复空列表闪退。
        expect:
          skill-loaded:
            name: change-summary
            loaded: false
          text-not-contains: [CHANGE_SUMMARY_OK]
